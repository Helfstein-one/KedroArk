[tool.kedro]
package_name = "test_glue_project"
project_name = "test-glue-project"
kedro_init_version = "0.19.1"
tools = ["Linting", "Testing", "Custom Logging", "Documentation", "Data Structure", "Kedro Viz"]

[project]
name = "test_glue_project"
version = "0.1.0"
description = "Kedro project configured for AWS Glue."
readme = "README.md"
requires-python = ">=3.9, <3.12"
dependencies = [
    "kedro[spark.SparkDataSet]~=0.19.1",
    "pyspark>=3.3.0,<3.5.0",
    "Faker>=19.0.0",
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "boto3>=1.28.0",

    "delta-spark>=2.4.0", # Or iceberg-spark-runtime if needed

]

[project.scripts]
"test_glue_project" = "test_glue_project.__main__:main"

[tool.pytest.ini_options]
addopts = """
--cov-report term-missing \
--cov src/test_glue_project \
--cov-fail-under 80 \
-ra \
--strict-markers
"""
markers = [
    "unit: mark test as a unit test (fast, logic only)",
    "integration: mark test as an integration test (I/O, connections)",
    "e2e: mark test as an end-to-end test (full pipeline run)",
    "performance: mark test as a performance/benchmark test"
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
