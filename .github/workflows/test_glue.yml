name: Test KedroArk - AWS Glue

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-glue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Generate Glue Project
        run: |
          poetry run kedroark init test-glue-project --compute "AWS Glue" --example finance --local-infra
        
      - name: Check Python Code Formatting & Linting (Ruff)
        run: |
          cd test-glue-project
          python -m pip install ruff
          ruff check .
          ruff format --check .

      - name: Terraform Formatting and Validation
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      - run: |
          cd test-glue-project/terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Run Unit Tests
        run: |
          cd test-glue-project
          python -m pip install -e .[testing]
          pytest -m unit

      - name: Run Integration & Local Infrastructure Tests
        run: |
          cd test-glue-project
          poetry run kedroark test-local

      - name: Verify Package Build (Wheel)
        run: |
          cd test-glue-project
          python -m pip install build
          python -m build
