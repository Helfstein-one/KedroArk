name: KedroArk CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  cli-quality:
    name: KedroArk CLI Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff poetry
          poetry install
      - name: Check Python Code Formatting (Ruff)
        run: ruff format --check kedroark/
      - name: Run Python Linter (Ruff)
        run: ruff check kedroark/

  scaffold:
    name: Scaffold EMR/Glue Projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install KedroArk
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
          python -m pip install -e .
      - name: Generate Glue Project
        run: kedroark init test_glue_project --compute "AWS Glue" --example finance --local-infra
      - name: Generate EMR Project
        run: kedroark init test_emr_project --compute "AWS EMR" --example finance --local-infra
      - name: Generate EMR Serverless Project
        run: kedroark init test_emrs_project --compute "AWS EMR Serverless" --example finance --local-infra
      - name: Upload Glue Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glue-project
          path: test_glue_project/
      - name: Upload EMR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emr-project
          path: test_emr_project/
      - name: Upload EMRS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emrs-project
          path: test_emrs_project/

  lint:
    name: Lint Generated (${{ matrix.project }})
    needs: scaffold
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [glue, emr, emrs]
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}-project
          path: test_${{ matrix.project }}_project
      - name: Check Python Code Formatting & Linting (Ruff)
        run: |
          cd test_${{ matrix.project }}_project
          python -m pip install ruff
          ruff check .
          ruff format --check .

  terraform:
    name: Validate Terraform (${{ matrix.project }})
    needs: scaffold
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [glue, emr, emrs]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}-project
          path: test_${{ matrix.project }}_project
      - name: Terraform Formatting and Validation
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      - run: |
          cd test_${{ matrix.project }}_project/terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  test-unit:
    name: Unit Test (${{ matrix.project }})
    needs: scaffold
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [glue, emr, emrs]
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}-project
          path: test_${{ matrix.project }}_project
      - name: Install Java (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Run Unit Tests
        run: |
          cd test_${{ matrix.project }}_project
          python -m pip install -e .
          pytest -m unit

  test-integration:
    name: Integration Test (${{ matrix.project }})
    needs: [scaffold, test-unit]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [glue, emr, emrs]
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}-project
          path: test_${{ matrix.project }}_project
      - name: Install Java (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Install project dependencies
        run: |
          cd test_${{ matrix.project }}_project
          python -m pip install -e .
      - name: Run Integration Tests
        run: |
          cd test_${{ matrix.project }}_project
          pytest -m integration --no-cov -v

  build:
    name: Build Package (${{ matrix.project }})
    needs: test-unit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [glue, emr, emrs]
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}-project
          path: test_${{ matrix.project }}_project
      - name: Verify Package Build (Wheel)
        run: |
          cd test_${{ matrix.project }}_project
          python -m pip install build
          python -m build
