name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java for PySpark
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[testing]
          pip install ruff build

      - name: Linter & Formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Unit Tests
        run: pytest -m unit

      - name: Integration & E2E Tests
        run: |
          pytest -m "integration or e2e"

      - name: Performance Tests
        run: pytest -m performance

      - name: Build Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -m build

      - name: Upload to AWS S3 (Placeholder)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "aws s3 cp dist/*.whl s3://my-artifacts-bucket/kedroark/{{ cookiecutter.project_slug }}/"
