# Spark Configuration for MinIO
{% if cookiecutter.include_local_infra == 'yes' %}
spark.hadoop.fs.s3a.endpoint: "http://127.0.0.1:9000"
spark.hadoop.fs.s3a.access.key: "minioadmin"
spark.hadoop.fs.s3a.secret.key: "minioadmin"
spark.hadoop.fs.s3a.path.style.access: "true"
spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
# We need to download AWS SDK and Hadoop AWS packages at runtime for local testing
spark.jars.packages: "org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262"
{% endif %}
