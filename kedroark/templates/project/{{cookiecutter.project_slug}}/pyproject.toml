[tool.kedro]
package_name = "{{ cookiecutter.project_slug }}"
project_name = "{{ cookiecutter.project_name }}"
kedro_init_version = "0.19.1"
tools = ["Linting", "Testing", "Custom Logging", "Documentation", "Data Structure", "Kedro Viz"]

[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "Kedro project configured for {{ cookiecutter.compute_target }}."
readme = "README.md"
requires-python = ">=3.9, <3.14"
dependencies = [
    "kedro~=0.19.1",
    "kedro-datasets==2.1.0",
    "pyspark>=3.3.0,<3.5.0",
    "Faker>=19.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "boto3>=1.28.0",
    "pandas>=2.0.0",
{% if cookiecutter.include_finance_example == 'yes' %}
    "delta-spark>=2.4.0", # Or iceberg-spark-runtime if needed
{% endif %}
]

[project.scripts]
"{{ cookiecutter.project_slug }}" = "{{ cookiecutter.project_slug }}.__main__:main"

[tool.pytest.ini_options]
addopts = """
--cov-report term-missing \
--cov src/{{ cookiecutter.project_slug }} \
--cov-fail-under 30 \
-ra \
--strict-markers
"""
markers = [
    "unit: mark test as a unit test (fast, logic only)",
    "integration: mark test as an integration test (I/O, connections)",
    "e2e: mark test as an end-to-end test (full pipeline run)",
    "performance: mark test as a performance/benchmark test"
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
