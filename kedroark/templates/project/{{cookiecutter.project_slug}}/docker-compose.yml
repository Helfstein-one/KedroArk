{% if cookiecutter.include_local_infra == 'yes' %}
version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  mc:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin && /usr/bin/mc ls myminio; do
        echo 'Waiting for MinIO...'
        sleep 1
      done;
      /usr/bin/mc mb myminio/my-data-bucket || true;
      exit 0;
      "

{% if cookiecutter.compute_target == 'AWS Glue' %}
  glue-dev:
    image: amazon/aws-glue-libs:glue_libs_4.0.0_image_01
    container_name: glue-runner
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - SPARK_SUBMIT_OPTIONS=--conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 --conf spark.hadoop.fs.s3a.access.key=minioadmin --conf spark.hadoop.fs.s3a.secret.key=minioadmin --conf spark.hadoop.fs.s3a.path.style.access=true
    volumes:
      - .:/workspace
      - ~/.aws:/home/glue_user/.aws
    working_dir: /workspace
    command: >
      bash -c "pip install -e . && python -c 'import boto3; s3 = boto3.client(\"s3\", endpoint_url=\"http://minio:9000\", aws_access_key_id=\"minioadmin\", aws_secret_access_key=\"minioadmin\"); s3.put_object(Bucket=\"my-data-bucket\", Key=\"raw/financial/data.csv\", Body=\"transaction_id,customer_id,amount,transaction_date,currency,status\\n1,cust_1,150.0,2026-05-19T22:00:00Z,USD,COMPLETED\\n2,cust_2,200.0,2026-05-19T22:01:00Z,EUR,COMPLETED\\n3,cust_3,-50.0,2026-05-19T22:02:00Z,USD,COMPLETED\\n4,cust_4,300.0,2026-05-19T22:03:00Z,USD,PENDING\\n\")' && spark-submit src/main.py --JOB_NAME local_test"
    depends_on:
      minio:
        condition: service_started
      mc:
        condition: service_completed_successfully
{% elif cookiecutter.compute_target == 'AWS EMR' %}
  emr-master:
    image: bitnamilegacy/spark:3.3.0
    container_name: emr-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - '8080:8080'
      - '7077:7077'
      
  emr-worker:
    image: bitnamilegacy/spark:3.3.0
    container_name: emr-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://emr-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - emr-master

  emr-submit:
    image: bitnamilegacy/spark:3.3.0
    container_name: emr-submit
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command: >
      bash -c "pip install -e . && python -c 'import boto3; s3 = boto3.client(\"s3\", endpoint_url=\"http://minio:9000\", aws_access_key_id=\"minioadmin\", aws_secret_access_key=\"minioadmin\"); s3.put_object(Bucket=\"my-data-bucket\", Key=\"raw/financial/data.csv\", Body=\"transaction_id,customer_id,amount,transaction_date,currency,status\\n1,cust_1,150.0,2026-05-19T22:00:00Z,USD,COMPLETED\\n2,cust_2,200.0,2026-05-19T22:01:00Z,EUR,COMPLETED\\n3,cust_3,-50.0,2026-05-19T22:02:00Z,USD,COMPLETED\\n4,cust_4,300.0,2026-05-19T22:03:00Z,USD,PENDING\\n\")' && kedro run --env local_infra"
    depends_on:
      emr-master:
        condition: service_started
      minio:
        condition: service_started
      mc:
        condition: service_completed_successfully
{% elif cookiecutter.compute_target == 'AWS EMR Serverless' %}
  emr-serverless-emulator:
    image: bitnamilegacy/spark:3.3.0
    container_name: emr-serverless
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command: >
      bash -c "pip install -e . && python -c 'import boto3; s3 = boto3.client(\"s3\", endpoint_url=\"http://minio:9000\", aws_access_key_id=\"minioadmin\", aws_secret_access_key=\"minioadmin\"); s3.put_object(Bucket=\"my-data-bucket\", Key=\"raw/financial/data.csv\", Body=\"transaction_id,customer_id,amount,transaction_date,currency,status\\n1,cust_1,150.0,2026-05-19T22:00:00Z,USD,COMPLETED\\n2,cust_2,200.0,2026-05-19T22:01:00Z,EUR,COMPLETED\\n3,cust_3,-50.0,2026-05-19T22:02:00Z,USD,COMPLETED\\n4,cust_4,300.0,2026-05-19T22:03:00Z,USD,PENDING\\n\")' && kedro run --env local_infra"
    depends_on:
      minio:
        condition: service_started
      mc:
        condition: service_completed_successfully
{% endif %}

volumes:
  minio_data:
{% endif %}
