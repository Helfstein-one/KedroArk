{% if cookiecutter.include_local_infra == 'yes' %}
version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  mc:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/my-data-bucket;
      exit 0;
      "

{% if cookiecutter.compute_target == 'AWS Glue' %}
  glue-dev:
    image: amazon/aws-glue-libs:4.0.0
    container_name: glue-runner
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - SPARK_SUBMIT_OPTIONS=--conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 --conf spark.hadoop.fs.s3a.access.key=minioadmin --conf spark.hadoop.fs.s3a.secret.key=minioadmin --conf spark.hadoop.fs.s3a.path.style.access=true
    volumes:
      - .:/workspace
      - ~/.aws:/home/glue_user/.aws
    working_dir: /workspace
    command: >
      bash -c "pip install -e . && spark-submit src/main.py --JOB_NAME local_test"
    depends_on:
      - minio
      - mc
{% elif cookiecutter.compute_target == 'AWS EMR' %}
  emr-master:
    image: bitnami/spark:3.3.0
    container_name: emr-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - '8080:8080'
      - '7077:7077'
      
  emr-worker:
    image: bitnami/spark:3.3.0
    container_name: emr-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://emr-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - emr-master

  emr-submit:
    image: bitnami/spark:3.3.0
    container_name: emr-submit
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command: >
      bash -c "pip install -e . && kedro run --env local_infra"
    depends_on:
      - emr-master
      - minio
      - mc
{% elif cookiecutter.compute_target == 'AWS EMR Serverless' %}
  emr-serverless-emulator:
    image: bitnami/spark:3.3.0
    container_name: emr-serverless
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command: >
      bash -c "pip install -e . && kedro run --env local_infra"
    depends_on:
      - minio
      - mc
{% endif %}

volumes:
  minio_data:
{% endif %}
